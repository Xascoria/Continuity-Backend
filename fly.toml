# Fly.io config for the API. The database is Supabase Postgres.
# See runbook.md. Change `app` if that name is already taken.

app = "20seconds-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Same number as internal_port below. Local docker does not read this file
  # and keeps listening on 8000.
  PORT = "8000"
  # admin_requests was the fastest-growing table. Set to "1" to collect again.
  LOG_ADMIN_REQUESTS = "0"
  # Fly's edge is the TCP peer. Trust X-Forwarded-For so bans see the player.
  TRUST_PROXY_HEADERS = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
